<!doctype html>
<html lang="zh-CN" data-theme="terminal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="BEN.OPS Infrastructure Engineering Knowledge Base: Linux, DevOps, SRE, Cloud and Security notes.">
  <meta property="og:title" content="BEN.OPS — Infrastructure Engineering Knowledge Base">
  <meta property="og:description" content="Linux · DevOps · SRE · Cloud · Security">
  <meta property="og:type" content="website">
  <title>BEN.OPS — Infrastructure Engineering Knowledge Base</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20261109-0745">
</head>
<body>
  <div class="reading-progress" id="reading-progress"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-toggle" id="menu-toggle" aria-label="打开目录">☰</button>
      <a class="brand" href="#home" aria-label="返回首页">
        <span class="brand-mark">$_</span>
        <span class="brand-copy">
          <strong>BEN.OPS</strong>
          <small>ENGINEERING NOTES</small>
        </span>
      </a>

      <div class="global-search">
        <span class="search-icon">grep</span>
        <input id="global-search" type="search" autocomplete="off" placeholder="搜索标题 / 标签 / 分类 / 正文">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="command-palette" id="search-palette" hidden></div>

      <div class="top-actions">
        <span class="system-status"><i></i> 本地数据已加载</span>
        <label class="theme-select-wrap" title="切换显示风格">
          <select id="theme-select">
            <option value="auto">自动 · 按时间</option>
            <option value="terminal">终端 · 深灰</option>
            <option value="matrix">终端 · 苔绿</option>
            <option value="blueprint">工程 · 蓝灰</option>
            <option value="amber">控制台 · 琥珀</option>
            <option value="light">阅读 · 暖白</option>
          </select>
        </label>
        <button class="icon-button" id="theme-cycle" title="快速切换主题">↻</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span>// NAVIGATION</span>
          <button class="sidebar-close" id="sidebar-close" aria-label="关闭目录">×</button>
        </div>
        <nav class="primary-nav" id="primary-nav"></nav>
        <div class="sidebar-section">
          <div class="sidebar-title">~/categories</div>
          <div class="category-tree" id="category-tree"></div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">~/tags</div>
          <div class="tag-cloud compact" id="sidebar-tags"></div>
        </div>
        <div class="sidebar-foot">
          <span id="build-date"></span>
          <span>本地 / 离线 / 就绪</span>
          <button class="utility-toggle" id="motion-toggle">命令动效：开</button>
          <button class="utility-toggle" id="eye-toggle">护眼模式：开</button>
        </div>
      </aside>

      <div class="drawer-backdrop" id="drawer-backdrop"></div>

      <main class="main-panel">
        <div class="content-head">
          <nav class="breadcrumb" id="breadcrumb"></nav>
          <button class="icon-button outline-button" id="open-search" title="全文搜索">⌕</button>
        </div>
        <section id="view" class="view-root" aria-live="polite">
          <div class="boot-state">
            <div class="boot-command"><span>root@ben-ops:~$</span> load ./knowledge-base</div>
            <strong>正在加载本地工程笔记</strong>
            <p>首次打开需要加载 1,134 篇文档索引，请稍候。</p>
            <div class="boot-progress"><i></i></div>
          </div>
        </section>
      </main>

      <aside class="toc-panel" id="toc-panel">
        <div id="right-panel-body"></div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <noscript>此离线知识库需要启用浏览器 JavaScript。</noscript>
  <script src="assets/vendor/marked.min.js?v=20261109-0620"></script>
  <script src="assets/vendor/highlight.min.js?v=20261109-0620"></script>
  <script src="assets/js/lucide.min.js?v=20261109-0620"></script>
  <script src="assets/data.js?v=20261109-0740"></script>
  <script src="assets/js/app.js?v=20261109-0740"></script>
</body>
</html>
